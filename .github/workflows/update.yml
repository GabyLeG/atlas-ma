# Rebuilds the data every night from the public sources and publishes the site on GitHub Pages.
# One-time setup: Settings > Pages > Source: "GitHub Actions"; secrets INPI_USERNAME and INPI_PASSWORD.
# If a source fails, the job fails and the previous version of the site stays online.
name: Mise à jour nocturne
on:
  schedule:
    - cron: "23 3 * * *"
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -r requirements.txt
      - name: Tests
        run: python -m pytest -q
      - name: Build data from public sources
        env:
          # Free INPI account (data.inpi.fr), stored in Settings > Secrets and variables > Actions. Never in the code.
          INPI_USERNAME: ${{ secrets.INPI_USERNAME }}
          INPI_PASSWORD: ${{ secrets.INPI_PASSWORD }}
        run: python -m pipeline.build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atlas M&amp;A</title>
<meta name="description" content="Map and valuation of French SMEs with up-to-date public accounts: DCF, EBITDA multiples, LBO test.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Schibsted+Grotesk:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top">
  <a class="brand" href="#carte" aria-label="Atlas, home">
    <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M4 22c5-9 9 2 14-6s8-6 10-5" /><path d="M4 16c5-9 9 2 14-6s8-6 10-5" opacity=".55"/><path d="M4 28c5-9 9 2 14-6s8-6 10-5" opacity=".3"/><circle cx="18" cy="16" r="2.6"/></svg>
    <span><b>Atlas</b><small>M&amp;A · French SMEs</small></span>
  </a>
  <nav class="tabs" aria-label="Views">
    <a href="#carte" data-view="map">Map</a>
    <a href="#liste" data-view="list">List</a>
    <a href="#analyse" data-view="co">Analysis</a>
    <a href="#quality" data-view="quality">Data quality</a>
  </nav>
  <div class="fresh" id="fresh"></div>
  <button class="ghost icon" id="methodBtn" aria-label="Method and sources">?</button>
</header>
<div class="sample" id="sampleBanner" hidden>Fictional sample data. The live version uses the real accounts filed with INPI, updated every night.</div>

<main class="shell">
  <aside class="filters" id="filters" aria-label="Filters">
    <div class="fhead"><h2>Filters</h2><button class="link" id="resetBtn">Clear all</button></div>
    <label class="field"><span>Company or SIREN</span><input id="fSearch" type="search" placeholder="e.g. 552 100 554" autocomplete="off"></label>
    <div class="field"><span>Sector</span><div class="chips" id="fMacro"></div>
      <select id="fDiv" aria-label="NAF division"><option value="">All divisions</option></select></div>
    <div class="field two"><label><span>Region</span><select id="fReg"><option value="">All of France</option></select></label>
      <label><span>Département</span><select id="fDep"><option value="">All</option></select></label></div>
    <div class="field"><span>Revenue (€m)</span>
      <div class="range2"><input id="fRmin" type="number" min="0" step="1" placeholder="min"><i>to</i><input id="fRmax" type="number" min="0" step="1" placeholder="max"></div>
      <div class="chips small" id="fRpre"></div></div>
    <label class="field slider"><span>Min. EBITDA margin <output id="oMargin"></output></span><input id="fMargin" type="range" min="-20" max="40" step="1" value="-20"></label>
    <label class="field slider"><span>Min. annual growth <output id="oGrowth"></output></span><input id="fGrowth" type="range" min="-5" max="20" step="1" value="-5"></label>
    <label class="field slider"><span>Max. EV / EBITDA <output id="oMult"></output></span><input id="fMult" type="range" min="2" max="25" step="0.5" value="25"></label>
    <label class="field slider"><span>Min. score <output id="oScore"></output></span><input id="fScore" type="range" min="0" max="100" step="5" value="0"></label>
    <label class="check"><input id="fPos" type="checkbox"> Positive EBITDA only</label>
    <div class="count"><b id="count">0</b> companies <span id="countSub"></span></div>
  </aside>

  <section class="view" id="v-map" aria-label="Map">
    <div class="maptools">
      <div class="seg" role="group" aria-label="Dot colour">
        <button data-color="sc" class="on">Score</button><button data-color="m">Margin</button><button data-color="g">Growth</button><button data-color="x">EV/EBITDA</button>
      </div>
      <div class="seg" role="group" aria-label="Map layer">
        <button data-fill="none" class="on">Dots</button><button data-fill="count">Density by département</button>
      </div>
    </div>
    <div class="mapwrap" id="mapwrap">
      <canvas id="map" aria-label="Map of companies"></canvas>
      <div class="tip" id="tip" hidden></div>
      <div class="legend" id="legend"></div>
      <div class="zoom"><button id="zin" aria-label="Zoom in">+</button><button id="zout" aria-label="Zoom out">−</button><button id="zreset" aria-label="Reset view">⤢</button></div>
      <article class="card" id="pick" hidden></article>
    </div>
  </section>

  <section class="view" id="v-list" aria-label="List" hidden>
    <div class="summary" id="summary"></div>
    <div class="tablebar"><span><span class="key rep">Reported in the filing</span> <span class="key est">Model estimate</span> <span id="sortNote"></span></span><button class="ghost" id="csvBtn">Export the list (CSV)</button></div>
    <div class="table" id="table" role="table" aria-label="Companies"><div class="thead" id="thead" role="row"></div><div class="tbody" id="tbody"></div></div>
  </section>

  <section class="view" id="v-quality" aria-label="Data quality" hidden>
    <div id="quality"></div>
  </section>

  <section class="view" id="v-co" aria-label="Analysis" hidden>
    <div id="co"></div>
  </section>
</main>

<dialog id="method"><form method="dialog"><div id="methodBody"></div><button class="primary" value="close">Close</button></form></dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="valuation.js"></script>
<script src="excel.js"></script>
<script src="app.js"></script>
</body>
</html>
